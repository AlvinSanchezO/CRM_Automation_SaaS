services:
  postgres-db:
    image: postgres:16-alpine
    container_name: crm_postgres
    environment:
      POSTGRES_USER: alvin_admin
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: crm_saas_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:alpine
    container_name: crm_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: